name: Validate xray-manager
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  static-and-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Dependencies
        run: sudo apt-get update && sudo apt-get install -y jq shellcheck curl unzip openssl python3 util-linux systemd
      - name: Syntax and shellcheck
        run: |
          for file in xray-manager.sh lib/*.sh tests/*.sh; do bash -n "$file"; done
          sh -n install.sh
          sh -n deploy.sh
          sh -n assets/xy
          for file in assets/*.openrc; do sh -n "$file"; done
          python3 -c 'import ast,pathlib; [ast.parse(p.read_text()) for p in pathlib.Path("assets").glob("*.py")]'
          shellcheck -x -S warning xray-manager.sh install.sh deploy.sh lib/*.sh tests/*.sh
      - name: System update schedule unit and calendar verification
        run: |
          verify_dir=$(mktemp -d)
          trap 'rm -rf -- "$verify_dir"' EXIT
          cp assets/xray-manager-system-update.service "$verify_dir/"
          for calendar in '*-*-* 04:00:00' 'Mon *-*-* 04:00:00' '*-*-01 04:00:00'; do
            sed "s/@CALENDAR@/$calendar/" assets/xray-manager-system-update.timer > "$verify_dir/xray-manager-system-update.timer"
            systemd-analyze verify "$verify_dir/xray-manager-system-update.service" "$verify_dir/xray-manager-system-update.timer"
            systemd-analyze calendar --iterations=1 "$calendar" > /dev/null
          done
      - name: Shell transactions
        run: bash tests/test-shell.sh
      - name: Review fixes, private export and failure recovery
        run: bash tests/test-review-fixes.sh
      - name: Interactive defaults, validation and terminal styles
        run: bash tests/test-interactive.sh
      - name: Management script update and code rollback
        run: bash tests/test-manager-update.sh
      - name: Node creation and terminal layout
        run: bash tests/test-node-ux.sh
      - name: SS2022 algorithms and key validation
        run: bash tests/test-ss2022.sh
      - name: Node edits and state transactions
        run: bash tests/test-edit.sh
      - name: Per-node outbound routes, migration and rollback
        run: bash tests/test-outbound-route.sh
      - name: Outbound URI parsing and route generation
        run: bash tests/test-outbound-protocol.sh
      - name: Portable migration and dual-core transactions
        run: bash tests/test-migration.sh
      - name: Terminal labels and pause behavior
        run: bash tests/test-ui.sh
      - name: Complete uninstall ownership and dependency ledger
        run: bash tests/test-clean-uninstall.sh
      - name: Auxiliary core platform
        run: bash tests/test-extra-platform.sh
      - name: New protocol structures and TLS portability
        run: bash tests/test-extra-protocol.sh
      - name: Platform tests
        run: bash tests/test-platform.sh
      - name: Restart schedule transactions and daemon
        run: bash tests/test-schedule.sh
      - name: System package update schedule transactions and daemon
        run: bash tests/test-system-update-schedule.sh
      - name: Global xy shortcut ownership
        run: bash tests/test-shortcut.sh
      - name: Protocol tests
        run: bash tests/test-protocol.sh
  os-smoke:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: ['debian:12', 'debian:13', 'alpine:3.23', 'alpine:3.24']
    steps:
      - uses: actions/checkout@v4
      - name: Package, binary, native configuration smoke test
        env:
          IMAGE: ${{ matrix.image }}
        run: |
          docker run --rm -v "$PWD:/src:ro" "$IMAGE" sh -ec '
            if command -v apk >/dev/null; then apk add --no-cache bash; else apt-get update && apt-get install -y bash; fi
            bash -c '\''
              source /src/lib/common.sh
              source /src/lib/platform.sh
              source /src/lib/protocol.sh
              platform_detect && platform_dependencies || exit 1
              bash /src/tests/test-clean-uninstall.sh || exit 1
              bash /src/tests/test-ui.sh || exit 1
              bash /src/tests/test-node-ux.sh || exit 1
              export XM_ROOT=/tmp/xm-smoke
              source /src/lib/common.sh
              platform_prepare || exit 1
              platform_fetch_core v26.10.31 "$XM_BIN" || exit 1
              printf "{\"schema_version\":1,\"core_version\":\"v26.10.31\",\"nodes\":[]}\n" > "$XM_ETC/state.json"
              protocol_generate "$XM_ETC/state.json" "$XM_ETC/config.json" || exit 1
              "$XM_BIN" run -test -config "$XM_ETC/config.json" || exit 1
              XRAY_BIN="$XM_BIN" bash /src/tests/test-ss2022.sh || exit 1
              XRAY_BIN="$XM_BIN" bash /src/tests/test-xhttp.sh || exit 1
              XRAY_BIN="$XM_BIN" bash /src/tests/test-outbound-protocol.sh || exit 1
              XRAY_BIN="$XM_BIN" bash /src/tests/test-outbound-e2e.sh || exit 1
              primary_smoke_bin=$XM_BIN
              export XM_ROOT=
              source /src/lib/common.sh
              platform_prepare && platform_extra_ensure || exit 1
              XRAY_BIN="$primary_smoke_bin" XM_EXTRA_BIN="$XM_EXTRA_BIN" bash /src/tests/test-extra-protocol.sh || exit 1
              XRAY_BIN="$primary_smoke_bin" XM_EXTRA_BIN="$XM_EXTRA_BIN" bash /src/tests/test-extra-e2e.sh || exit 1
            '\''
          '
# Container jobs do not claim systemd/OpenRC boot or ARM64 service verification.
