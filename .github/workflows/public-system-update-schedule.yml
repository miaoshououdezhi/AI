name: Diagnose Alpine package removal
on:
  push:
    branches: [codex/system-update-schedule-public-smoke-20261011]
permissions:
  contents: read
jobs:
  package-plan-diagnostics:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Install public main and inspect read-only package simulation
        run: |
          set -euo pipefail
          docker run --rm --init --cap-add NET_ADMIN --cap-add SYS_PTRACE -i alpine:3.24 sh -s <<'ALPINE'
          set -eu
          apk add --no-cache bash openrc wget ca-certificates curl jq
          mkdir -p /run/openrc
          printf 'default\n' > /run/openrc/softlevel
          rc-service loopback start
          curl -fsSL https://raw.githubusercontent.com/miaoshououdezhi/AI/669ef32d7c73edd11a2a70292413bd1dfe1893bb/deploy.sh > /tmp/install.sh
          sh /tmp/install.sh
          xy --yes update-system
          cat /etc/xray-manager/dependency-ledger.json
          cat /etc/apk/world
          python3 - <<'PY'
          from pathlib import Path
          source=Path('/opt/xray-manager/lib/platform.sh').read_text()
          needle=" assert removed and removed<=candidates,"
          assert source.count(needle)==1
          source=source.replace(needle," human('信息','DIAGNOSTIC candidates='+str(sorted(candidates))+' removed='+str(sorted(removed))+' unexpected='+str(sorted(removed-candidates)))\n"+needle)
          Path('/tmp/diagnostic-platform.sh').write_text(source)
          PY
          python3 - <<'PY'
          import json,subprocess
          j=json.load(open('/etc/xray-manager/dependency-ledger.json'))
          names=sorted(set(j['added'])-set(j['baseline'])-{'iproute2-minimal','libelf','libmnl','iproute2'})
          print('DIAGNOSTIC world-anchor request',names,flush=True)
          subprocess.run(['apk','del','--simulate','--']+names,check=True)
          PY
          bash -c 'source /tmp/diagnostic-platform.sh; XM_OS=alpine; _platform_dependency_plan /etc/xray-manager/dependency-ledger.json' || result=$?
          printf 'DIAGNOSTIC read-only plan exit=%s\n' "${result:-0}"
          ALPINE
