name: Verify reviewed recovery on Alpine
on:
  push:
    branches: [codex/system-update-schedule-public-smoke-20261011]
permissions:
  contents: read
jobs:
  candidate-alpine-uninstall:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        image: ['alpine:3.23', 'alpine:3.24']
    steps:
      - name: Exact candidate install, guards and incomplete-install cleanup
        env:
          EXPECTED_CANDIDATE: 7354681ae63f278246167493d7bd324a96a409e6
          EXPECTED_RUNTIME: 77180865d0f24fdab7ba4ab8fc0fc8c5721097c5
          IMAGE: ${{ matrix.image }}
        run: |
          set -euo pipefail
          docker run --rm --init --cap-add NET_ADMIN --cap-add SYS_PTRACE \
            -e EXPECTED_CANDIDATE -e EXPECTED_RUNTIME "$IMAGE" sh -ec '
              apk add --no-cache bash openrc wget ca-certificates curl jq
              mkdir -p /run/openrc
              printf "default\n" > /run/openrc/softlevel
              rc-service loopback start
              sort /etc/apk/world > /tmp/baseline-world
              curl -fsSL "https://raw.githubusercontent.com/miaoshououdezhi/AI/$EXPECTED_CANDIDATE/deploy.sh" > /tmp/candidate.sh
              grep -F "AI/archive/$EXPECTED_RUNTIME.tar.gz" /tmp/candidate.sh
              sh /tmp/candidate.sh
              curl -fsSL "https://github.com/miaoshououdezhi/AI/archive/$EXPECTED_RUNTIME.tar.gz" -o /tmp/runtime.tar.gz
              mkdir /tmp/expected-runtime
              tar -xzf /tmp/runtime.tar.gz -C /tmp/expected-runtime --strip-components=1
              for file in xray-manager.sh lib/platform.sh; do cmp "/tmp/expected-runtime/$file" "/opt/xray-manager/$file"; done
              xy diagnose
              xy service disable
              test ! -e /etc/runlevels/default/xray-manager
              xy service enable
              test -L /etc/runlevels/default/xray-manager
              xy service status
              xy export /tmp/private-export.json
              test "$(stat -c %a /tmp/private-export.json)" = 600
              cmp /etc/xray-manager/state.json /tmp/private-export.json
              mkfifo /tmp/rejected-export.fifo
              export_status=0
              timeout 5 xy export /tmp/rejected-export.fifo || export_status=$?
              test "$export_status" = 1
              test -p /tmp/rejected-export.fifo
              target=04:00
              if test "$(date +%H:%M)" = "$target"; then target=12:00; fi
              xy --yes schedule set "$target"
              pid_before=$(cat /run/xray-manager.pid)
              xy scheduled-restart
              test "$(cat /run/xray-manager.pid)" = "$pid_before"
              xy logs main 5
              xy logs restart 5
              xy --yes schedule disable
              printf "fixture auxiliary log\n" > /var/log/xray-manager/extra-console.log
              chown root:xray-manager /var/log/xray-manager/extra-console.log
              chmod 0640 /var/log/xray-manager/extra-console.log
              xy logs extra 5
              logrotate -d /etc/logrotate.d/xray-manager
              xy --yes update-system
              xy --yes system-update-schedule set weekly 04:00
              rc-service xray-manager-system-update status
              xy logs update 5
              jq -r ".baseline[]" /etc/xray-manager/dependency-ledger.json | sort > /tmp/baseline-packages
              bash -c "source /opt/xray-manager/lib/common.sh; source /opt/xray-manager/lib/platform.sh; platform_detect; _platform_dependency_plan /etc/xray-manager/dependency-ledger.json" | tee /tmp/safe-package-plan
              test -s /tmp/safe-package-plan
              xargs apk del --simulate -- < /tmp/safe-package-plan
              bash -c "source /opt/xray-manager/lib/common.sh; source /opt/xray-manager/lib/platform.sh; platform_detect; platform_remove_service"
              rm -f /etc/xray-manager/state.json /etc/xray-manager/config.json /etc/xray-manager/extra.json /opt/xray-manager/bin/xray
              test ! -e /etc/init.d/xray-manager
              test -f /opt/xray-manager/xray-manager.sh
              xy --yes uninstall
              test -f /tmp/private-export.json
              apk info | sort > /tmp/remaining-packages
              test -z "$(comm -23 /tmp/baseline-packages /tmp/remaining-packages)"
              sort /etc/apk/world > /tmp/remaining-world
              test -z "$(comm -23 /tmp/baseline-world /tmp/remaining-world)"
              test ! -e /usr/local/bin/xy
              test ! -e /etc/xray-manager
              test ! -e /opt/xray-manager
              test ! -e /etc/init.d/xray-manager-system-update
              test ! -e /etc/runlevels/default/xray-manager-system-update
              test ! -e /run/xray-manager-system-update.pid
              test ! -e /var/log/xray-manager/system-update-schedule.log
              printf "PASS candidate exact runtime, boot/export/log/due guards, real update, incomplete-install cleanup, external export and baseline packages preserved\n"
            '
# Disposable container only; no host mounts, networking or published ports.
